spring.application.name=paideia-backend

# Enderecos do front que podem chamar a API (separados por virgula). Em producao, trocar pela URL do site.
paideia.cors.allowed-origins=${PAIDEIA_CORS_ORIGINS:http://localhost:5173}

# Decisao 0003: a API nao registra o que o aluno enviou. Estes logs do Spring poderiam citar valores recusados.
logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver=ERROR
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR
