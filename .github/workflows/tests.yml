name: tests

# Roda os testes do motor Java (que confere os casos gerados pelo Python) e os da referência em Python.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Testes do server (JUnit)
        run: mvn -B -f server/pom.xml test

  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes da referência em Python
        run: python -m unittest discover -s data
