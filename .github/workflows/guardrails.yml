name: guardrails

# Rede de segurança para R1 (segredos) e R4 (sem IA como coautora).
# As travas locais ficam em .githooks/; aqui conferimos de novo depois do push.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets-and-authorship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks 8.30.1
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: R1, procurar segredo em todo o histórico
        run: gitleaks detect --redact --verbose

      - name: R4, mensagens de commit sem IA como coautora
        run: git log --format=%B | sh scripts/check-commit-message.sh
